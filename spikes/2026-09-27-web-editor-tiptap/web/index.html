<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phraise web editor (spike 7)</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div id="toolbar-identity">
          <span id="doc-name"></span>
          <span id="user-name"></span>
        </div>
        <button id="markdown-toggle" type="button">Markdown</button>
      </header>
      <main id="panes">
        <div id="editor"></div>
        <aside id="markdown-panel" hidden>
          <pre id="markdown-output"></pre>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
